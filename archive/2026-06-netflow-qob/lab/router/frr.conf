! FRR config for the RTBH router-under-test.
!
! Source-based RTBH the same way prod does it:
!  - ExaBGP announces the attacker /32 with the blackhole community, next-hop
!    set to the discard address 192.0.2.1.
!  - 192.0.2.1/32 is a static blackhole route here (the "Null0" equivalent),
!    so the announced /32 recursively resolves to a blackhole in the kernel FIB.
!  - Strict uRPF (rp_filter, set in setup.sh) on the ingress interface then
!    drops any packet whose SOURCE resolves to that blackhole route.
!
frr defaults traditional
hostname rtbh-router
log stdout
!
interface eth1
 ip address 10.0.1.1/24
!
interface eth2
 ip address 10.0.2.1/24
!
! Discard / "Null0" route: the RTBH trigger next-hop points here.
ip route 192.0.2.1/32 blackhole
!
router bgp 65000
 bgp router-id 172.20.20.11
 no bgp ebgp-requires-policy
 neighbor 172.20.20.12 remote-as 65001
 neighbor 172.20.20.12 ebgp-multihop 4
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.20.20.12 route-map RTBH-IN in
 exit-address-family
!
bgp community-list standard BLACKHOLE permit 65535:666
!
! Accept the blackhole-tagged /32 (next-hop 192.0.2.1 does the discard).
route-map RTBH-IN permit 10
 match community BLACKHOLE
!
route-map RTBH-IN permit 20
!
