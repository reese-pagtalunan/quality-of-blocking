# ExaBGP — stands in for bhr-client-exabgp. Peers with the FRR router.
#
# Dynamic block/unblock without exabgpcli: a long-lived `tail -f` streams a
# commands file to exabgp's stdin-API. blackhole.sh appends announce/withdraw
# lines to that file (see lab/exabgp/blackhole.sh).

process watch-commands {
    run /usr/bin/tail -f /var/run/exabgp/commands.txt;
    encoder text;
}

neighbor 172.20.20.11 {
    router-id 172.20.20.12;
    local-address 172.20.20.12;
    local-as 65001;
    peer-as 65000;

    family {
        ipv4 unicast;
    }

    api {
        processes [ watch-commands ];
    }
}
