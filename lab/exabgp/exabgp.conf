# ExaBGP — stands in for bhr-client-exabgp. Peers with the FRR router and lets
# us announce/withdraw a source-RTBH /32 at runtime via exabgpcli.
#
# The actual block is injected from lab/exabgp/blackhole.sh (block|unblock),
# which calls exabgpcli against this running process.

process announce-api {
    run /usr/bin/env python3 -c "import sys,time;[time.sleep(3600) for _ in iter(int,1)]";
    encoder text;
}

neighbor 172.20.20.11 {
    router-id 172.20.20.12;
    local-address 172.20.20.12;
    local-as 65001;
    peer-as 65000;
    group-updates false;

    family {
        ipv4 unicast;
    }

    api {
        processes [ announce-api ];
    }
}
