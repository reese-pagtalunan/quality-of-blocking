# Fluentd: tail goflow2's JSON flow file and ship to Elasticsearch.
#
# goflow2 (-format json -transport file) writes one JSON object per flow per
# line. We tail it, then index into qob-flow-YYYY.MM.DD (matches the index
# template in lab/es/flow-index-template.json and qob's GOFLOW2_FIELD_MAP).

<source>
  @type tail
  path /var/log/goflow2/flows.json
  pos_file /var/log/goflow2/flows.pos
  tag goflow2.flow
  read_from_head true
  <parse>
    @type json
  </parse>
</source>

# PoC note: @timestamp is set to Fluentd ingest time (≈ now), which is fine for
# "last N minutes" queries since flows index within seconds. For production,
# parse time_flow_start_ns into @timestamp to avoid skew on backfills.
<match goflow2.flow>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix qob-flow
  include_timestamp true
  suppress_type_name true
  <buffer>
    @type memory
    flush_interval 2s
    retry_max_interval 5
  </buffer>
</match>
